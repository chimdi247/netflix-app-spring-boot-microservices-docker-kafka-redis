spring:
  application:
    name: encoding-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: encoding-service-group
      auto-offset-reset: earliest
      # Encoding runs inside the listener thread and can take many minutes. Without these two settings the
      # consumer is thrown out of the group after the default 5 minutes (max.poll.interval.ms), the video is
      # re-delivered and encoded again, over and over.
      max-poll-records: 1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        max.poll.interval.ms: 7200000
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: com.netflix.encodingservice.event.VideoUploadedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      concurrency: 1

server:
  port: 8083
  shutdown: graceful

# Object storage. Docker Compose points this at MinIO; leave AWS_S3_ENDPOINT empty to use real AWS S3.
aws:
  access-key: ${AWS_ACCESS_KEY:YOUR_AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY:YOUR_AWS_SECRET_KEY}
  region: ${AWS_REGION:us-east-1}
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    bucket-name: ${AWS_BUCKET_NAME:netflix-streaming-videos}

# FFmpeg: "ffmpeg" is found on the PATH in the Docker image; on Windows set FFMPEG_PATH=C:/ffmpeg/bin/ffmpeg.exe
ffmpeg:
  path: ${FFMPEG_PATH:ffmpeg}

# Temp directory for encoding
encoding:
  temp-dir: ${TEMP_DIR:${java.io.tmpdir}/encoding}
  timeout-minutes: ${ENCODING_TIMEOUT_MINUTES:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # trace_id / span_id are put into the MDC by the OpenTelemetry Java agent
    level: "%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]"
