global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: docker

# Alerts are Grafana-managed (observability/grafana/provisioning/alerting); Prometheus only evaluates recording rules.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ---- Prometheus itself ----------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ---- application telemetry: OpenTelemetry metrics exposed by the collector ------
  - job_name: otel-collector-app-metrics
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  # ---- containers and host ---------------------------------------------------------
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # ---- MySQL (one exporter per server) and ProxySQL --------------------------------
  - job_name: mysql
    static_configs:
      - targets: ['mysqld-exporter-primary:9104']
        labels: { instance_name: mysql-primary, role: primary }
      - targets: ['mysqld-exporter-replica-1:9104']
        labels: { instance_name: mysql-replica-1, role: replica }
      - targets: ['mysqld-exporter-replica-2:9104']
        labels: { instance_name: mysql-replica-2, role: replica }

  - job_name: proxysql
    metrics_path: /metrics
    static_configs:
      - targets: ['proxysql:6070']

  # ---- Kafka: broker JMX metrics + consumer-group / topic metrics ---------------------
  - job_name: kafka-jmx
    static_configs:
      - targets: ['kafka:7071']

  - job_name: kafka-exporter
    static_configs:
      - targets: ['kafka-exporter:9308']

  # ---- Redis, object storage ----------------------------------------------------------
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  # ---- observability stack self-monitoring ---------------------------------------------
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  # ---- uptime / availability: HTTP probes (label "service" is used by the dashboards and alerts) ------
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://auth-service:8085/actuator/health']
        labels: { service: auth-service }
      - targets: ['http://content-service:8081/actuator/health']
        labels: { service: content-service }
      - targets: ['http://video-service:8082/actuator/health']
        labels: { service: video-service }
      - targets: ['http://encoding-service:8083/actuator/health']
        labels: { service: encoding-service }
      - targets: ['http://streaming-service:8084/actuator/health']
        labels: { service: streaming-service }
      - targets: ['http://frontend:80/healthz']
        labels: { service: frontend }
      - targets: ['http://minio:9000/minio/health/live']
        labels: { service: minio }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---- uptime of the data layer: TCP connect ---------------------------------------------------
  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['mysql-primary:3306']
        labels: { service: mysql-primary }
      - targets: ['mysql-replica-1:3306']
        labels: { service: mysql-replica-1 }
      - targets: ['mysql-replica-2:3306']
        labels: { service: mysql-replica-2 }
      - targets: ['proxysql:6033']
        labels: { service: proxysql }
      - targets: ['kafka:9092']
        labels: { service: kafka }
      - targets: ['redis:6379']
        labels: { service: redis }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
