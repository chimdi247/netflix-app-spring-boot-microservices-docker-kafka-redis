# Generated by tools/gen_alerts.py - Grafana-managed alert rules (evaluated by Grafana, e-mailed through SMTP).
apiVersion: 1
groups:
- orgId: 1
  name: data-layer
  folder: Netflix Alerts
  interval: 1m
  rules:
  - uid: mysql-down
    title: MySQL server unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: mysql_up
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: OK
    for: 1m
    annotations:
      summary: '{{ $$labels.instance_name }} is unreachable'
      description: mysqld-exporter cannot connect to {{ $$labels.instance_name }} ({{ $$labels.role }}).
    labels:
      severity: critical
    isPaused: false
  - uid: mysql-replication-broken
    title: MySQL replication stopped
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: mysql_slave_status_slave_io_running{role="replica"} * mysql_slave_status_slave_sql_running{role="replica"}
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: OK
    for: 2m
    annotations:
      summary: Replication stopped on {{ $$labels.instance_name }}
      description: The replication I/O or SQL thread of {{ $$labels.instance_name }} is not running. ProxySQL removes it from the reader pool; reads fall back to the other servers.
    labels:
      severity: critical
    isPaused: false
  - uid: mysql-replication-lag
    title: MySQL replica lagging
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: mysql_slave_status_seconds_behind_master{role="replica"}
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: gt
            params:
            - 30
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: OK
    for: 2m
    annotations:
      summary: '{{ $$labels.instance_name }} is {{ $$values.B.Value | printf "%.0f" }}s behind the primary'
      description: Replication lag of {{ $$labels.instance_name }} is above 30 seconds (ProxySQL stops using replicas above 10 seconds).
    labels:
      severity: warning
    isPaused: false
  - uid: mysql-connections-high
    title: MySQL connections above 80%
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: 100 * mysql_global_status_threads_connected / mysql_global_variables_max_connections
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: gt
            params:
            - 80
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: OK
    for: 3m
    annotations:
      summary: Connections above 80% on {{ $$labels.instance_name }}
      description: '{{ $$labels.instance_name }} uses {{ $$values.B.Value | printf "%.0f" }}% of max_connections.'
    labels:
      severity: warning
    isPaused: false
  - uid: kafka-consumer-lag-high
    title: Kafka consumer lag above 100
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag)
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: gt
            params:
            - 100
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: OK
    for: 5m
    annotations:
      summary: Consumer lag on {{ $$labels.topic }}
      description: Consumer group {{ $$labels.consumergroup }} is {{ $$values.B.Value | printf "%.0f" }} messages behind on {{ $$labels.topic }}. Encoding or status updates are falling behind.
    labels:
      severity: warning
    isPaused: false
  - uid: kafka-under-replicated
    title: Kafka under-replicated partitions
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: kafka_server_replicamanager_underreplicatedpartitions
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: OK
    for: 2m
    annotations:
      summary: Kafka has under-replicated partitions
      description: '{{ $$values.B.Value | printf "%.0f" }} partitions are under-replicated.'
    labels:
      severity: warning
    isPaused: false
  - uid: redis-down
    title: Redis unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: redis_up
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: OK
    for: 1m
    annotations:
      summary: Redis is unreachable
      description: redis-exporter cannot connect to Redis. Streaming URLs cannot be cached.
    labels:
      severity: critical
    isPaused: false
