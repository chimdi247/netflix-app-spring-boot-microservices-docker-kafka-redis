# Generated by tools/gen_alerts.py - Grafana-managed alert rules (evaluated by Grafana, e-mailed through SMTP).
apiVersion: 1
groups:
- orgId: 1
  name: service-health
  folder: Netflix Alerts
  interval: 1m
  rules:
  - uid: service-down
    title: Service down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: probe_success{job=~"blackbox-.*"}
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: OK
    for: 1m
    annotations:
      summary: '{{ $$labels.service }} is down'
      description: The health probe of {{ $$labels.service }} has been failing for more than 1 minute.
    labels:
      severity: critical
    isPaused: false
  - uid: http-5xx-rate-high
    title: HTTP 5xx error rate above 5%
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: 100 * sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5..", http_route!~"/actuator.*"}[5m])) / sum by (service_name) (rate(http_server_request_duration_seconds_count{http_route!~"/actuator.*"}[5m]))
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: gt
            params:
            - 5
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: OK
    for: 5m
    annotations:
      summary: 5xx errors above 5% on {{ $$labels.service_name }}
      description: '{{ $$labels.service_name }} answered {{ $$values.B.Value | printf "%.1f" }}% of its requests with a server error over the last 5 minutes.'
    labels:
      severity: warning
    isPaused: false
  - uid: http-p95-latency-high
    title: HTTP p95 latency above 1s
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: histogram_quantile(0.95, sum by (le, service_name) (rate(http_server_request_duration_seconds_bucket{http_route!~"/actuator.*|/api/v1/videos/upload.*"}[5m])))
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: gt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: OK
    for: 5m
    annotations:
      summary: p95 latency above 1s on {{ $$labels.service_name }}
      description: p95 request latency of {{ $$labels.service_name }} is {{ $$values.B.Value | printf "%.2f" }}s.
    labels:
      severity: warning
    isPaused: false
  - uid: video-encoding-failed
    title: Video encoding failed
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: increase(netflix_encoding_jobs_total{result="failed"}[10m])
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: OK
    for: 0s
    annotations:
      summary: A video failed to encode
      description: '{{ $$values.B.Value | printf "%.0f" }} encoding job(s) failed in the last 10 minutes. Check the encoding-service logs in Grafana (Loki) and the trace of the upload.'
    labels:
      severity: warning
    isPaused: false
