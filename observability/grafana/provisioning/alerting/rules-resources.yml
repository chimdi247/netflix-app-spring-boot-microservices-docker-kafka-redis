# Generated by tools/gen_alerts.py - Grafana-managed alert rules (evaluated by Grafana, e-mailed through SMTP).
apiVersion: 1
groups:
- orgId: 1
  name: cpu-and-memory-above-50-percent
  folder: Netflix Alerts
  interval: 1m
  rules:
  - uid: container-cpu-above-50
    title: Container CPU above 50%
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: container:cpu_usage:percent{name!~".*k6.*"}
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        legendFormat: __auto
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: gt
            params:
            - 50
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: OK
    for: 3m
    annotations:
      summary: CPU above 50% on container {{ $$labels.name }}
      description: Container {{ $$labels.name }} used {{ $$values.B.Value | printf "%.1f" }}% of its CPU limit for more than 3 minutes (threshold 50%).
    labels:
      severity: warning
    isPaused: false
