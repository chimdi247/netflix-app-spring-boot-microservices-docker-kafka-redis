spring:
  application:
    name: content-service
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # tables are created by docker/mysql/init/01-schema.sql
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: content-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap

server:
  port: 8081
  shutdown: graceful

# Two pools, both through ProxySQL (see config/DataSourceConfig.java)
#   writer account -> ProxySQL hostgroup 10 -> MySQL primary
#   reader account -> ProxySQL hostgroup 20 -> MySQL replicas (load balanced)
app:
  datasource:
    writer:
      jdbc-url: ${DB_WRITER_URL:jdbc:mysql://localhost:3306/content_db?useSSL=false&allowPublicKeyRetrieval=true}
      username: ${DB_WRITER_USER:netflix}
      password: ${DB_WRITER_PASSWORD:netflix_pw}
      pool-name: content-writer
      maximum-pool-size: ${DB_WRITER_POOL_SIZE:10}
    reader:
      jdbc-url: ${DB_READER_URL:${app.datasource.writer.jdbc-url}}
      username: ${DB_READER_USER:${app.datasource.writer.username}}
      password: ${DB_READER_PASSWORD:${app.datasource.writer.password}}
      pool-name: content-reader
      maximum-pool-size: ${DB_READER_POOL_SIZE:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # trace_id / span_id are put into the MDC by the OpenTelemetry Java agent
    level: "%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]"
