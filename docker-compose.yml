# =============================================================================
# Netflix streaming platform - the whole thing with one command:
#
#     docker compose up -d --build
#
#   The app (React)          http://localhost:5173     admin@example.com / password123
#   Kafka UI                 http://localhost:8080
#   Redis UI                 http://localhost:8081
#   MinIO console (storage)  http://localhost:9001     minioadmin / minioadmin
#   Grafana                  http://localhost:3030     admin / admin   (folder "Netflix")
#   Prometheus               http://localhost:9090
#   Mailpit (alert e-mails)  http://localhost:8025
#   cAdvisor                 http://localhost:8082
#   MySQL primary            localhost:3306            root / root   (replicas are not published)
#   ProxySQL                 localhost:6033 (SQL)  localhost:6032 (admin: radmin / radmin)
#
# The backend services (auth, content, video, encoding, streaming) are NOT published on the host:
# every request goes through the nginx edge in the "frontend" container, which checks the JWT first.
#
# Performance tests (k6):  ./tests/run.sh smoke | load | stress | spike | soak | breakpoint | pipeline
#
# Every value below has a default; copy .env.example to .env to override any of them.
# Reset everything (databases, topics, bucket, metrics):   docker compose down -v
# =============================================================================
name: netflix

networks:
  default:
    name: netflix-network

# ---- shared blocks ----------------------------------------------------------
x-otel-env: &otel-env
  # OpenTelemetry Java agent (attached in every Dockerfile): traces, metrics and logs go to the collector,
  # which forwards them to Tempo, Prometheus and Loki. W3C trace context is propagated over HTTP and Kafka.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
  OTEL_BLRP_SCHEDULE_DELAY: "2000"
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=netflix,deployment.environment=docker
  OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES: "true"
  OTEL_INSTRUMENTATION_MESSAGING_EXPERIMENTAL_RECEIVE_TELEMETRY_ENABLED: "true"

x-storage-env: &storage-env
  # MinIO by default. For real AWS S3 set S3_ENDPOINT= (empty), S3_PUBLIC_ENDPOINT= (empty),
  # S3_ACCESS_KEY / S3_SECRET_KEY / AWS_REGION / AWS_BUCKET_NAME to your values.
  AWS_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  AWS_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-netflix-streaming-videos}
  AWS_S3_ENDPOINT: ${S3_ENDPOINT-http://minio:9000}
  # address of the store as seen from the viewer's BROWSER (pre-signed URLs are signed for it)
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT-http://localhost:9000}

x-java-limits: &java-limits
  # Limits make the "CPU / memory above 50 %" alerts meaningful: usage is measured against them.
  resources:
    limits:
      cpus: "1.0"
      memory: 1280M

services:
  # ===========================================================================
  # MySQL: 1 primary + 2 replicas, behind ProxySQL
  # ===========================================================================
  mysql-primary:
    image: mysql:8.0
    container_name: mysql-primary
    restart: unless-stopped
    command: >
      --server-id=1 --log-bin=mysql-bin --binlog-format=ROW
      --gtid-mode=ON --enforce-gtid-consistency=ON --log-replica-updates=ON
      --binlog-expire-logs-seconds=604800
      --max-connections=300 --innodb-buffer-pool-size=128M
      --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_primary_data:/var/lib/mysql
      # *.sql run once, in name order, on the first start (schema, accounts, admin user ...)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP (-h 127.0.0.1): during first-time initialisation the server only listens on a socket
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-replica-1: &mysql-replica
    image: mysql:8.0
    container_name: mysql-replica-1
    restart: unless-stopped
    # read-only is switched on by the mysql-init job (SET PERSIST), a read-only server cannot be initialised
    command: >
      --server-id=2 --log-bin=mysql-bin --relay-log=relay-bin --binlog-format=ROW
      --gtid-mode=ON --enforce-gtid-consistency=ON --log-replica-updates=ON
      --max-connections=300 --innodb-buffer-pool-size=128M
      --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_replica_1_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-replica-2:
    <<: *mysql-replica
    container_name: mysql-replica-2
    command: >
      --server-id=3 --log-bin=mysql-bin --relay-log=relay-bin --binlog-format=ROW
      --gtid-mode=ON --enforce-gtid-consistency=ON --log-replica-updates=ON
      --max-connections=300 --innodb-buffer-pool-size=128M
      --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_replica_2_data:/var/lib/mysql

  proxysql:
    # connection pooling, read/write split and load balancing in front of MySQL (config: docker/proxysql/proxysql.cnf)
    image: ${PROXYSQL_IMAGE:-proxysql/proxysql:2.6.2}
    container_name: proxysql
    restart: unless-stopped
    ports:
      - "6033:6033"   # SQL
      - "6032:6032"   # admin
    volumes:
      - ./docker/proxysql/proxysql.cnf:/etc/proxysql.cnf:ro
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica-1:
        condition: service_healthy
      mysql-replica-2:
        condition: service_healthy

  mysql-init:
    # one-shot: starts replication, makes replicas read-only, waits until ProxySQL serves reads and writes
    image: mysql:8.0
    container_name: mysql-init
    restart: "no"
    entrypoint: ["/bin/bash", "/init/replication-init.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - ./docker/mysql/replication-init.sh:/init/replication-init.sh:ro
    depends_on:
      proxysql:
        condition: service_started
      mysql-primary:
        condition: service_healthy
      mysql-replica-1:
        condition: service_healthy
      mysql-replica-2:
        condition: service_healthy

  # ===========================================================================
  # Kafka (KRaft) + UI, Redis + UI, MinIO (S3)
  # ===========================================================================
  kafka:
    build:
      context: ./docker/kafka
    image: netflix/kafka-jmx:3.9.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # PLAINTEXT for containers (kafka:9092), EXTERNAL for tools on your machine (localhost:9094)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Prometheus JMX exporter: broker metrics on :7071/metrics
      KAFKA_OPTS: -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7071:/opt/jmx/kafka-jmx.yml
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # KAFKA_OPTS is emptied for the probe, otherwise the CLI would start a second JMX agent on port 7071
      test: ["CMD-SHELL", "KAFKA_OPTS= /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 25s

  kafka-init:
    # one-shot: creates the topics (docker/kafka/create-topics.sh)
    image: netflix/kafka-jmx:3.9.0
    container_name: kafka-init
    restart: "no"
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./docker/kafka/create-topics.sh:/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: netflix
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redispass}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "netflix:redis:6379:0:${REDIS_PASSWORD:-redispass}"
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy

  minio:
    # S3-compatible object storage for the raw uploads and the encoded HLS files
    image: ${MINIO_IMAGE:-elestio/minio:latest}
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"   # S3 API: the browser downloads video segments from here with pre-signed URLs
      - "9001:9001"   # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    # one-shot: creates the private bucket
    image: pgsty/mc:latest
    container_name: minio-init
    restart: "no"
    entrypoint: ["/bin/sh", "/create-bucket.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-netflix-streaming-videos}
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ./docker/minio/create-bucket.sh:/create-bucket.sh:ro
    depends_on:
      minio:
        condition: service_healthy

  # ===========================================================================
  # Application services (published only through the nginx edge)
  # ===========================================================================
  auth-service:
    build:
      context: ./auth-service
    image: netflix/auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: auth-service
      DB_URL: jdbc:mysql://proxysql:6033/auth_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: netflix
      DB_PASSWORD: netflix_pw
      JWT_SECRET: ${JWT_SECRET:-0c9f1d6a7b3e48c2a5d0e9f4b8a17c63d2e5f60718293a4b5c6d7e8f9a0b1c2d}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-720}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy: *java-limits

  content-service:
    build:
      context: ./content-service
    image: netflix/content-service:latest
    container_name: content-service
    restart: unless-stopped
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: content-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # writes -> ProxySQL hostgroup 10 (primary); read-only transactions -> hostgroup 20 (replicas)
      DB_WRITER_URL: jdbc:mysql://proxysql:6033/content_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_WRITER_USER: netflix
      DB_WRITER_PASSWORD: netflix_pw
      DB_READER_URL: jdbc:mysql://proxysql:6033/content_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_READER_USER: netflix_ro
      DB_READER_PASSWORD: netflix_ro_pw
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy: *java-limits

  video-service:
    build:
      context: ./video-service
    image: netflix/video-service:latest
    container_name: video-service
    restart: unless-stopped
    environment:
      <<: [*otel-env, *storage-env]
      OTEL_SERVICE_NAME: video-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy: *java-limits

  encoding-service:
    build:
      context: ./encoding-service
    image: netflix/encoding-service:latest
    container_name: encoding-service
    restart: unless-stopped
    environment:
      <<: [*otel-env, *storage-env]
      OTEL_SERVICE_NAME: encoding-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FFMPEG_PATH: ffmpeg
      TEMP_DIR: /tmp/encoding
      ENCODING_TIMEOUT_MINUTES: ${ENCODING_TIMEOUT_MINUTES:-120}
    volumes:
      # videos are downloaded and encoded here: keep them out of the container layer
      - encoding_tmp:/tmp/encoding
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"      # FFmpeg uses every core it gets
          memory: 1536M

  streaming-service:
    build:
      context: ./streaming-service
    image: netflix/streaming-service:latest
    container_name: streaming-service
    restart: unless-stopped
    environment:
      <<: [*otel-env, *storage-env]
      OTEL_SERVICE_NAME: streaming-service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy: *java-limits

  frontend:
    # nginx: serves the React app and is the single entry point for the API (JWT checked with auth_request)
    build:
      context: ./frontend
    image: netflix/frontend:latest
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      auth-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
      streaming-service:
        condition: service_healthy

  demo-seed:
    # one-shot: logs in as admin and uploads the sample clip for three demo movies (SEED_DEMO_MOVIES=false to skip)
    image: curlimages/curl:latest
    container_name: demo-seed
    restart: "no"
    entrypoint: ["/bin/sh", "/seed/seed-demo.sh"]
    environment:
      API_URL: http://frontend
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: password123
      SEED_DEMO_MOVIES: ${SEED_DEMO_MOVIES:-true}
    volumes:
      - ./docker/demo:/seed:ro
    depends_on:
      frontend:
        condition: service_healthy
      encoding-service:
        condition: service_healthy

  # ===========================================================================
  # Observability
  # ===========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.7.2
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver   # Tempo pushes span metrics, k6 pushes load-test metrics
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Grafana-managed alerts are e-mailed through this SMTP server (default: Mailpit, a local inbox)
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:-}:${SMTP_PORT:-}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM:-}
      GF_SMTP_FROM_NAME: Netflix Platform Alerts
      GF_SMTP_STARTTLS_POLICY: ${SMTP_STARTTLS_POLICY:-NoStartTLS}
      GF_SMTP_SKIP_VERIFY: ${SMTP_SKIP_VERIFY:-false}
      # recipient of the alert e-mails (read by observability/grafana/provisioning/alerting/contact-points.yml)
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
      - proxysql

  mailpit:
    # catch-all SMTP server with a web inbox: read alert e-mails without a real mail account
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # web inbox
      - "1025:1025"   # SMTP

  cadvisor:
    # per-container CPU / memory / network
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command: ["--docker_only=true", "--housekeeping_interval=10s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"

  node-exporter:
    # the Docker host ("node"): CPU / memory / disk / network
    image: prom/node-exporter:v1.9.0
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave

  blackbox-exporter:
    # HTTP probes of every service -> uptime and availability SLI
    image: prom/blackbox-exporter:v0.26.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  mysqld-exporter-primary: &mysqld-exporter
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter-primary
    restart: unless-stopped
    command:
      - --config.my-cnf=/etc/mysqld-exporter/primary.cnf
      - --collect.info_schema.innodb_metrics
    volumes:
      - ./observability/mysqld-exporter/primary.cnf:/etc/mysqld-exporter/primary.cnf:ro
    depends_on:
      mysql-init:
        condition: service_completed_successfully

  mysqld-exporter-replica-1:
    <<: *mysqld-exporter
    container_name: mysqld-exporter-replica-1
    command:
      - --config.my-cnf=/etc/mysqld-exporter/replica-1.cnf
      - --collect.info_schema.innodb_metrics
    volumes:
      - ./observability/mysqld-exporter/replica-1.cnf:/etc/mysqld-exporter/replica-1.cnf:ro

  mysqld-exporter-replica-2:
    <<: *mysqld-exporter
    container_name: mysqld-exporter-replica-2
    command:
      - --config.my-cnf=/etc/mysqld-exporter/replica-2.cnf
      - --collect.info_schema.innodb_metrics
    volumes:
      - ./observability/mysqld-exporter/replica-2.cnf:/etc/mysqld-exporter/replica-2.cnf:ro

  redis-exporter:
    image: oliver006/redis_exporter:v1.69.0
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
    depends_on:
      redis:
        condition: service_healthy

  kafka-exporter:
    # consumer group lag, topic offsets and partition state
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy

  # ===========================================================================
  # Performance tests (not started by `docker compose up`; run with ./tests/run.sh)
  # ===========================================================================
  k6:
    image: grafana/k6:0.57.0
    profiles: ["tests"]
    working_dir: /tests
    environment:
      BASE_URL: http://frontend
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),max,avg
      K6_PROMETHEUS_RW_STALE_MARKERS: "true"
    volumes:
      - ./tests:/tests:ro
      - ./tests/results:/results
    depends_on:
      frontend:
        condition: service_healthy
      prometheus:
        condition: service_started

volumes:
  mysql_primary_data:
  mysql_replica_1_data:
  mysql_replica_2_data:
  kafka_data:
  redis_data:
  minio_data:
  encoding_tmp:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
