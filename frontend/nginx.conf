# Edge proxy: serves the React app and is the ONLY way into the backend services.
# Every API call except login/register is checked with auth_request against the auth-service first.

# Docker's embedded DNS. Using variables in proxy_pass lets nginx start even if a service is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # video uploads (the services accept up to 2 GB)
  client_max_body_size 2g;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ---- authentication (public: login, register; /me checks the token itself) ---------------------
  location /api/v1/auth/ {
    set $auth http://auth-service:8085;
    proxy_pass $auth;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # ---- token check used by auth_request. "internal": cannot be called from outside. ---------------
  # The auth-service answers 200 (allowed), 401 (no/invalid token) or 403 (needs the ADMIN role:
  # any non-GET request on movies or video upload).
  location = /_auth {
    internal;
    set $auth http://auth-service:8085;
    proxy_pass $auth/internal/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URI $request_uri;
  }

  # ---- catalog ------------------------------------------------------------------------------------
  location /api/v1/movies {
    auth_request /_auth;
    auth_request_set $user_id $upstream_http_x_user_id;
    auth_request_set $user_role $upstream_http_x_user_role;
    set $content http://content-service:8081;
    proxy_pass $content;
    proxy_set_header Host $host;
    proxy_set_header X-User-Id $user_id;
    proxy_set_header X-User-Role $user_role;
  }

  # ---- video upload: large bodies are streamed through, not buffered ------------------------------
  location /api/v1/videos {
    auth_request /_auth;
    auth_request_set $user_id $upstream_http_x_user_id;
    set $video http://video-service:8082;
    proxy_pass $video;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-User-Id $user_id;
  }

  # ---- streaming: pre-signed URLs and signed playlists ------------------------------------------------
  location /api/v1/stream {
    auth_request /_auth;
    auth_request_set $user_id $upstream_http_x_user_id;
    set $streaming http://streaming-service:8084;
    proxy_pass $streaming;
    proxy_set_header Host $host;
    proxy_set_header X-User-Id $user_id;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # single page app: unknown paths fall back to index.html
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    try_files $uri $uri/ /index.html;
  }
}
