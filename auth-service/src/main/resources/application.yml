spring:
  application:
    name: auth-service
  datasource:
    # Connects through ProxySQL (connection pooling + routing). Writes and reads both use the writer
    # account here: a login right after registering must see the new row.
    url: ${DB_URL:jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:netflix}
    password: ${DB_PASSWORD:netflix_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: auth-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # tables are created by docker/mysql/init/01-schema.sql
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8085
  shutdown: graceful

app:
  jwt:
    # at least 32 characters; set JWT_SECRET in production
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123456789}
    ttl-minutes: ${JWT_TTL_MINUTES:720}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # trace_id / span_id are put into the MDC by the OpenTelemetry Java agent
    level: "%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]"
